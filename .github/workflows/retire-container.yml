name: Retire previous container package

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  retire:
    if: github.repository == 'xiaoyu-work/Yu-OS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the previous container package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE --silent users/xiaoyu-work/packages/container/claw-os
