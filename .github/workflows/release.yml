name: Release Yu OS

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Component to publish; all runs the shared test suite first"
        required: true
        default: all
        type: choice
        options:
          - agent
          - base
          - core
          - desktop
          - installer
          - images
          - website
          - all
      desktop_shell_version:
        description: "Approved immutable Desktop Shell build version (required for desktop, installer or all)"
        required: false
        type: string
      release_security_bootstrap:
        description: "One-time migration for a package repository without a release-security baseline"
        required: false
        default: false
        type: boolean

concurrency:
  group: yuos-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      agent: ${{ steps.plan.outputs.agent }}
      base: ${{ steps.plan.outputs.base }}
      desktop: ${{ steps.plan.outputs.desktop }}
      installer: ${{ steps.plan.outputs.installer }}
      images: ${{ steps.plan.outputs.images }}
      pages: ${{ steps.plan.outputs.pages }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install isolated Desktop Shell verifier dependency
        if: inputs.target == 'desktop' || inputs.target == 'installer' || inputs.target == 'all'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Freeze release version, authenticated Apps and Desktop Shell input
        id: plan
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          DESKTOP_SHELL_RELEASE: ${{ inputs.desktop_shell_version }}
          RELEASE_SECURITY_BOOTSTRAP: ${{ inputs.release_security_bootstrap && '1' || '0' }}
        run: bash scripts/ci/prepare-release.sh

      - name: Import signing key
        env:
          YUOS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: bash scripts/ci/import-signing-key.sh

      - name: Export the image and repository public key
        run: install -m 0644 "$YUOS_RELEASE_SECURITY_KEYRING" build/release/yuos-archive-keyring.gpg

      - name: Retain same-run release inputs
        uses: actions/upload-artifact@v4
        with:
          name: yuos-release-inputs
          path: build/release
          if-no-files-found: error
          overwrite: true

  test:
    needs: prepare
    if: inputs.target == 'all'
    uses: ./.github/workflows/test.yml
    with:
      app_source_artifact: yuos-release-inputs

  # Unselected jobs may be skipped; failed or cancelled prerequisites never
  # admit a build or publication.
  build-agent:
    needs: [prepare, test, build-base]
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.agent == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            musl_target: x86_64-unknown-linux-musl
            gnu_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            musl_target: aarch64-unknown-linux-musl
            gnu_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      YUOS_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      CLAW_APP_PACKAGE_ROOT: ${{ github.workspace }}/build/release/app-packages
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: yuos-release-inputs
          path: build/release

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.musl_target }},${{ matrix.gnu_target }}

      - name: Install host build tools
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools dpkg-dev fakeroot libpam0g-dev

      - name: Import signing key
        env:
          YUOS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: bash scripts/ci/import-signing-key.sh

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-
            ${{ runner.os }}-${{ runner.arch }}-agent-
            ${{ runner.os }}-${{ runner.arch }}-cargo-build-

      - name: Build shared Agent binaries
        run: |
          source scripts/lib/arch.sh
          cargo build --release --locked -p yu --target "$RUST_TARGET"
          cargo build --release --locked \
            --manifest-path desktop/services/yuos-applet-services/Cargo.toml \
            --bin yuos-calendar-reader --target "$RUST_TARGET" \
            --target-dir "$GITHUB_WORKSPACE/target"
          cargo build --release --locked \
            --manifest-path crates/yuos-nearby/Cargo.toml --bins \
            --target "${RUST_TARGET/-musl/-gnu}" --target-dir "$GITHUB_WORKSPACE/target"
          cargo build --release --locked -p yuos-display-login --target "${RUST_TARGET/-musl/-gnu}"
          cargo build --release --locked -p yuos-semantic --target "${RUST_TARGET/-musl/-gnu}"

      - name: Build Agent package
        env:
          GPG_PASSPHRASE: ${{ secrets.CLAW_OS_APT_SIGNING_PASSPHRASE }}
        run: bash packaging/deb/build-debs.sh agent

      - name: Exercise the Claw-owned Agent TUI
        run: bash scripts/ci/test-agent-package.sh tui

      - name: Verify Agent ownership, App APT inputs and signed release manifest
        run: bash scripts/ci/verify-package.sh agent

      - name: Install and reinstall Agent on Ubuntu
        if: needs.prepare.outputs.base != 'true'
        run: bash scripts/ci/test-agent-package.sh installed

      - name: Download compatible Base for the install transaction
        if: needs.prepare.outputs.base == 'true'
        uses: actions/download-artifact@v4
        with:
          name: yuos-base
          path: build/debs

      - name: Install and reinstall Agent and Base together on Ubuntu
        if: needs.prepare.outputs.base == 'true'
        run: bash scripts/ci/test-agent-package.sh installed-core

      - name: Verify official App Store installation and real product Web MCP
        if: matrix.arch == 'amd64'
        timeout-minutes: 35
        run: |
          node="$(command -v node)"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,YUOS_PACKAGE_VERSION \
            python3 -B scripts/ci/verify_official_app_store.py "$node"

      - name: Upload Agent package
        uses: actions/upload-artifact@v4
        with:
          name: yuos-agent-${{ matrix.arch }}
          path: build/debs/yuos-agent_*_${{ matrix.arch }}.deb
          if-no-files-found: error
          overwrite: true

  build-base:
    needs: [prepare, test]
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.base == 'true' }}
    runs-on: ubuntu-latest
    env:
      YUOS_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install package build tools
        run: sudo apt-get update -qq && sudo apt-get install -y dpkg-dev fakeroot

      - name: Import signing key
        env:
          YUOS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: bash scripts/ci/import-signing-key.sh

      - name: Build Base package
        env:
          GPG_PASSPHRASE: ${{ secrets.CLAW_OS_APT_SIGNING_PASSPHRASE }}
        run: bash packaging/deb/build-debs.sh base

      - name: Verify Base payload and signed release manifest
        run: bash scripts/ci/verify-package.sh base

      - name: Upload Base package
        uses: actions/upload-artifact@v4
        with:
          name: yuos-base
          path: build/debs/yuos-base_*_all.deb
          if-no-files-found: error
          overwrite: true

  build-desktop:
    needs: [prepare, test]
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      YUOS_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      CLAW_APP_PACKAGE_ROOT: ${{ github.workspace }}/build/release/app-packages
    steps:
      - name: Prepare disposable hosted-runner build space
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if [ -d "$directory" ]; then
              sudo du -sh -- "$directory"
            fi
          done
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/download-artifact@v4
        with:
          name: yuos-release-inputs
          path: build/release

      - name: Install host build tools
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools debootstrap curl ca-certificates python3 gnupg git-lfs bubblewrap

      - name: Import signing key
        env:
          YUOS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: bash scripts/ci/import-signing-key.sh

      - name: Build Desktop package in its Debian rootfs
        env:
          GPG_PASSPHRASE: ${{ secrets.CLAW_OS_APT_SIGNING_PASSPHRASE }}
        run: |
          sudo --preserve-env=GNUPGHOME,YUOS_RELEASE_SECURITY_KEY_ID,GPG_PASSPHRASE,YUOS_PACKAGE_VERSION,CLAW_APP_PACKAGE_ROOT \
            env ARCH="$ARCH" DESKTOP_PACKAGE_ONLY=1 \
            ./rootfs/build.sh --features base,desktop

      - name: Verify Desktop ownership, App APT inputs and signed release manifest
        run: bash scripts/ci/verify-package.sh desktop

      - name: Upload Desktop package
        uses: actions/upload-artifact@v4
        with:
          name: yuos-desktop-${{ matrix.arch }}
          path: build/debs/yuos-desktop_*_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  build-website:
    needs: [prepare, test]
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.pages == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build website once
        run: |
          npm ci --prefix web --no-audit --no-fund \
            --registry=https://registry.npmjs.org \
            --replace-registry-host=always
          npm run build --prefix web

      - uses: actions/upload-artifact@v4
        with:
          name: yuos-website
          path: web/dist
          if-no-files-found: error
          overwrite: true

  build-images:
    needs: [prepare, build-agent, build-base]
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.images == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      YUOS_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      CLAW_APP_PACKAGE_ROOT: ${{ github.workspace }}/build/release/app-packages
      YUOS_APT_PUBLIC_KEY_FILE: ${{ github.workspace }}/build/release/yuos-archive-keyring.gpg
      YUOS_RELEASE_SECURITY_KEYRING: ${{ github.workspace }}/build/release/yuos-archive-keyring.gpg
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: yuos-release-inputs
          path: build/release

      - uses: actions/download-artifact@v4
        with:
          name: yuos-agent-${{ matrix.arch }}
          path: build/debs

      - uses: actions/download-artifact@v4
        with:
          name: yuos-base
          path: build/debs

      - name: Install image build tools
        run: sudo apt-get update -qq && sudo apt-get install -y debootstrap curl ca-certificates python3 gnupg dpkg-dev

      - name: Verify same-run image packages
        run: |
          bash scripts/ci/verify-package.sh agent
          bash scripts/ci/verify-package.sh base

      - name: Select the shared headless profile
        run: |
          source scripts/lib/image-profiles.sh
          echo "ROOTFS_FEATURES=$IMAGE_FEATURES_HEADLESS_RUNTIME" >> "$GITHUB_ENV"

      - name: Build one rootfs from the prepared Agent and Base packages
        run: |
          sudo --preserve-env=YUOS_PACKAGE_VERSION,YUOS_APT_PUBLIC_KEY_FILE,CLAW_APP_PACKAGE_ROOT \
            env ARCH="$ARCH" ./rootfs/build.sh --features "$ROOTFS_FEATURES"

      - name: Verify the shared rootfs has no human account
        run: |
          sudo bash -c '
            source scripts/lib/image-identity.sh
            assert_no_human_login_users build/yuos-rootfs "shared $1 rootfs"
          ' image-identity "$ARCH"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push the architecture image
        env:
          DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ matrix.arch }}
        run: |
          label_args=()
          while IFS= read -r label; do
            [ -n "$label" ] && label_args+=(--label "$label")
          done <<< "$DOCKER_LABELS"
          sudo tar --numeric-owner -cf - \
            targets/docker/Dockerfile targets/docker/container-entrypoint.sh \
            build/yuos-rootfs \
            | docker buildx build --platform "$PLATFORM" \
                --file targets/docker/Dockerfile \
                --build-arg ROOTFS_DIR=build/yuos-rootfs \
                --tag "$REGISTRY/${IMAGE_NAME,,}:$IMAGE_TAG" \
                "${label_args[@]}" --push -

      - name: Remove Docker build cache
        if: always()
        run: docker buildx prune --all --force || true

      - name: Package WSL from the same stamped rootfs
        run: |
          sudo --preserve-env=YUOS_PACKAGE_VERSION,YUOS_APT_PUBLIC_KEY_FILE,CLAW_APP_PACKAGE_ROOT \
            env ARCH="$ARCH" FEATURES="$ROOTFS_FEATURES" ./targets/wsl/build.sh

      - name: Compute WSL checksums
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          cd build
          sha256sum "yuos-wsl-${ARCH}.wsl" > "yuos-wsl-${ARCH}.wsl.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: yuos-wsl-${{ matrix.arch }}
          path: |
            build/yuos-wsl-${{ matrix.arch }}.wsl
            build/yuos-wsl-${{ matrix.arch }}.wsl.sha256
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  build-installer:
    needs: [prepare, build-agent, build-base, build-desktop]
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.installer == 'true' }}
    runs-on: ubuntu-24.04
    env:
      ARCH: amd64
      YUOS_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      CLAW_APP_PACKAGE_ROOT: ${{ github.workspace }}/build/release/app-packages
      YUOS_APT_PUBLIC_KEY_FILE: ${{ github.workspace }}/build/release/yuos-archive-keyring.gpg
      YUOS_RELEASE_SECURITY_KEYRING: ${{ github.workspace }}/build/release/yuos-archive-keyring.gpg
    steps:
      - name: Prepare hosted-runner space
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: yuos-release-inputs
          path: build/release

      - uses: actions/download-artifact@v4
        with:
          name: yuos-agent-amd64
          path: build/debs

      - uses: actions/download-artifact@v4
        with:
          name: yuos-base
          path: build/debs

      - uses: actions/download-artifact@v4
        with:
          name: yuos-desktop-amd64
          path: build/debs

      - name: Install ISO build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debootstrap curl ca-certificates python3 gnupg dpkg-dev bubblewrap \
            squashfs-tools xorriso mtools grub-common grub-efi-amd64-bin grub-pc-bin

      - name: Verify the same-run system packages and signed App closure
        run: |
          for component in agent base desktop; do
            bash scripts/ci/verify-package.sh "$component"
          done

      - name: Compose a Debian 13 Desktop installer from the verified packages
        run: |
          sudo --preserve-env=ARCH,YUOS_PACKAGE_VERSION,YUOS_APT_PUBLIC_KEY_FILE,CLAW_APP_PACKAGE_ROOT \
            env CLAW_PREBUILT_SYSTEM_PACKAGES=1 ./build.sh iso-installer

      - name: Verify package versions and BIOS and UEFI boot entries
        run: |
          for component in agent base desktop; do
            test "$(sudo chroot build/yuos-rootfs dpkg-query -W -f='${Version} ${db:Status-Status}' "yuos-$component")" \
              = "$YUOS_PACKAGE_VERSION installed"
          done
          iso=yuos-installer-amd64.iso
          cd build
          boot_report=$(xorriso -indev "$iso" -report_el_torito plain)
          grep -Eq 'El Torito boot img.*BIOS' <<<"$boot_report"
          grep -Eq 'El Torito boot img.*UEFI' <<<"$boot_report"
          sha256sum "$iso" > "$iso.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: yuos-desktop-installer-amd64
          path: |
            build/yuos-installer-amd64.iso
            build/yuos-installer-amd64.iso.sha256
          retention-days: 30
          if-no-files-found: error

  publish-pages:
    needs: [prepare, build-agent, build-base, build-desktop, build-website]
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.pages == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: yuos-apt-pages
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: yuos-website
          path: build/web-dist

      - name: Download new Agent packages
        if: needs.prepare.outputs.agent == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: yuos-agent-*
          path: build/debs
          merge-multiple: true

      - name: Download new Base package
        if: needs.prepare.outputs.base == 'true'
        uses: actions/download-artifact@v4
        with:
          name: yuos-base
          path: build/debs

      - name: Download new Desktop packages
        if: needs.prepare.outputs.desktop == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: yuos-desktop-*
          path: build/debs
          merge-multiple: true

      - name: Install repository tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils gnupg

      - name: Import signing key
        env:
          YUOS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_OS_APT_SIGNING_PRIVATE_KEY }}
        run: bash scripts/ci/import-signing-key.sh

      - name: Merge and sign the repository once
        env:
          GPG_PASSPHRASE: ${{ secrets.CLAW_OS_APT_SIGNING_PASSPHRASE }}
          YUOS_WEB_DIST_DIR: ${{ github.workspace }}/build/web-dist
          YUOS_RELEASE_SECURITY_BOOTSTRAP: ${{ inputs.release_security_bootstrap && '1' || '0' }}
        run: |
          EXISTING_APT_REPO_URL="https://xiaoyu-work.github.io/Yu-OS/apt" \
            APT_PUBLIC_KEYRING="$YUOS_RELEASE_SECURITY_KEYRING" \
            bash packaging/apt-repo/sync-existing-packages.sh
          bash packaging/apt-repo/build-repo.sh
          mkdir build/apt-repo/apt
          mv build/apt-repo/{dists,pool,yuos-archive-keyring.gpg,yuos-archive-keyring.asc} build/apt-repo/apt/

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apt-repo

      - name: Deploy GitHub Pages once
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  publish-docker:
    needs: [prepare, build-images]
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.images == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish the multi-architecture manifest
        env:
          SOURCE_TAG: ${{ github.sha }}-${{ github.run_id }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" \
              "$REGISTRY/${IMAGE_NAME,,}:$SOURCE_TAG-amd64" \
              "$REGISTRY/${IMAGE_NAME,,}:$SOURCE_TAG-arm64"
          done <<< "$TAGS"
          first_tag="$(printf '%s\n' "$TAGS" | sed -n '1p')"
          docker buildx imagetools inspect "$first_tag"

  publish-wsl:
    needs: [prepare, build-images]
    if: >-
      ${{ !failure() && !cancelled() && needs.prepare.outputs.images == 'true' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yuos-wsl-*
          path: build
          merge-multiple: true

      - name: Compute release metadata
        id: artifact
        run: |
          cd build
          for arch in amd64 arm64; do
            sha256sum --check "yuos-wsl-${arch}.wsl.sha256"
            sha="$(cut -d' ' -f1 "yuos-wsl-${arch}.wsl.sha256")"
            size="$(du -h "yuos-wsl-${arch}.wsl" | cut -f1)"
            echo "${arch}_sha=$sha" >> "$GITHUB_OUTPUT"
            echo "${arch}_size=$size" >> "$GITHUB_OUTPUT"
            echo "- yuos-wsl-${arch}.wsl ($size): \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Publish WSL release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'yuos-wsl-latest' || github.ref_name }}
          name: ${{ github.ref == 'refs/heads/main' && 'WSL rolling build (main)' || format('Yu OS {0}', github.ref_name) }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          target_commitish: ${{ github.sha }}
          body: |
            Yu OS WSL2 distributions.

            **Commit:** ${{ github.sha }}

            | Architecture | File | SHA-256 | Size |
            |---|---|---|---|
            | amd64 | `yuos-wsl-amd64.wsl` | `${{ steps.artifact.outputs.amd64_sha }}` | ${{ steps.artifact.outputs.amd64_size }} |
            | arm64 | `yuos-wsl-arm64.wsl` | `${{ steps.artifact.outputs.arm64_sha }}` | ${{ steps.artifact.outputs.arm64_size }} |

            Download the package matching your Windows CPU architecture:

            ```powershell
            $package = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { ".\yuos-wsl-arm64.wsl" } else { ".\yuos-wsl-amd64.wsl" }
            wsl --install --from-file $package --name yuos --location C:\WSL\yuos --version 2
            ```

            First launch asks you to create the UNIX username and password.
          files: |
            build/yuos-wsl-amd64.wsl
            build/yuos-wsl-amd64.wsl.sha256
            build/yuos-wsl-arm64.wsl
            build/yuos-wsl-arm64.wsl.sha256

      - name: Move the rolling tag to the published commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/yuos-wsl-latest" \
            -f sha="$GITHUB_SHA" -F force=true
