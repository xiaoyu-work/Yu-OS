name: Publish SDK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK SemVer already declared by Python, Node, and Rust"
        required: true
        default: "0.1.0"
        type: string

concurrency:
  group: yuos-sdk-release
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: write

jobs:
  provenance-tools:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    env:
      SDK_VERSION: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install portable CLI build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Test and build the public provenance CLI
        run: |
          set -euo pipefail
          python3 -c 'import os, pathlib, tomllib; assert tomllib.loads(pathlib.Path("core/Cargo.toml").read_text())["package"]["version"] == os.environ["SDK_VERSION"]'
          cargo test -p yu --lib --locked provenance:: -- --test-threads=1
          cargo build --release --locked -p yu --bin yu --target "$RUST_TARGET"
          mkdir -p dist
          install -m 0755 "target/$RUST_TARGET/release/yu" "dist/yu-provenance-linux-$ARCH"
          test "$(stat -c %s "dist/yu-provenance-linux-$ARCH")" -le 134217728
          "dist/yu-provenance-linux-$ARCH" --version | grep -F "$SDK_VERSION"
          cargo metadata --locked --format-version 1 --filter-platform "$RUST_TARGET" > "$RUNNER_TEMP/tool-metadata.json"
      - name: Retain tool source pins and upstream notices
        run: |
          python3 - <<'PY'
          import io, json, os, pathlib, tarfile
          metadata = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "tool-metadata.json").read_text())
          packages = {package["id"]: package for package in metadata["packages"]}
          nodes = {node["id"]: node for node in metadata["resolve"]["nodes"]}
          root = next(package["id"] for package in packages.values()
                      if pathlib.Path(package["manifest_path"]).resolve() == pathlib.Path("core/Cargo.toml").resolve())
          selected, pending = set(), [root]
          while pending:
              identity = pending.pop()
              if identity in selected:
                  continue
              selected.add(identity)
              pending.extend(dependency["pkg"] for dependency in nodes[identity]["deps"])
          records = []
          archive = pathlib.Path("dist") / f'yu-provenance-linux-{os.environ["ARCH"]}-notices.tar.gz'
          with tarfile.open(archive, "w:gz") as stream:
              stream.add("LICENSE", arcname="LICENSE", recursive=False)
              for identity in sorted(selected):
                  package = packages[identity]
                  directory = pathlib.Path(package["manifest_path"]).parent
                  paths = {path for path in directory.iterdir() if path.is_file()
                           and path.name.upper().startswith(("LICENSE", "LICENCE", "COPYING", "NOTICE"))}
                  if package.get("license_file"):
                      paths.add(directory / package["license_file"])
                  for path in sorted(paths):
                      content = path.read_bytes()
                      info = tarfile.TarInfo(f'{package["name"]}-{package["version"]}/{path.name}')
                      info.size, info.mode = len(content), 0o644
                      stream.addfile(info, io.BytesIO(content))
                  records.append({name: package.get(name) for name in ("name", "version", "source", "license")})
              content = json.dumps({"revision": os.environ["GITHUB_SHA"], "packages": records},
                                   sort_keys=True, indent=2).encode()
              info = tarfile.TarInfo("sources.json")
              info.size, info.mode = len(content), 0o644
              stream.addfile(info, io.BytesIO(content))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yu-provenance-tool-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: provenance-tools
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SDK_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: yuos-sdk/node/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: yuos-sdk/go/go.mod
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release version
        run: |
          if ! [[ "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: invalid SDK SemVer: $SDK_VERSION" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import tomllib

          root = pathlib.Path("yuos-sdk")
          expected = os.environ["SDK_VERSION"]
          sys.path.insert(0, str(root / "python" / "src"))
          from yuos_sdk import __version__ as python_version

          versions = {
              "python": python_version,
              "node": json.loads(
                  (root / "node" / "package.json").read_text(encoding="utf-8")
              )["version"],
              "node-lock": json.loads(
                  (root / "node" / "package-lock.json").read_text(encoding="utf-8")
              )["version"],
              "node-lock-package": json.loads(
                  (root / "node" / "package-lock.json").read_text(encoding="utf-8")
              )["packages"][""]["version"],
              "rust": tomllib.loads(
                  (root / "rust" / "Cargo.toml").read_text(encoding="utf-8")
              )["package"]["version"],
          }
          cargo_lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text(encoding="utf-8"))
          versions["rust-lock"] = next(
              package["version"]
              for package in cargo_lock["package"]
              if package["name"] == "yuos-sdk"
          )
          mismatches = {name: version for name, version in versions.items() if version != expected}
          if mismatches:
              raise SystemExit(f"SDK version mismatch; expected {expected}: {mismatches}")

          module = (root / "go" / "go.mod").read_text(encoding="utf-8").splitlines()[0]
          expected_module = "module github.com/xiaoyu-work/Yu-OS/yuos-sdk/go"
          if module != expected_module:
              raise SystemExit(f"unexpected Go module path: {module!r}")
          PY

      - name: Regenerate wire bindings
        run: |
          python3 yuos-sdk/wire/codegen.py
          git diff --exit-code -- \
            yuos-sdk/rust/src/generated.rs \
            yuos-sdk/python/src/yuos_sdk/generated.py \
            yuos-sdk/node/src/generated.ts \
            yuos-sdk/go/generated.go

      - name: Install SDK test and build dependencies
        run: |
          python3 -m pip install --upgrade build pytest
          npm ci --prefix yuos-sdk/node

      - name: Test all SDK bindings
        run: |
          PYTHONPATH=yuos-sdk/python/src \
            python3 -m pytest -q yuos-sdk/python/src
          npm test --prefix yuos-sdk/node
          cargo test -p yuos-sdk -- --test-threads=1
          (cd yuos-sdk/go && go test ./...)

      - name: Build SDK release artifacts
        run: |
          mkdir -p dist

          python3 -m build --outdir "$GITHUB_WORKSPACE/dist" yuos-sdk/python

          npm run build --prefix yuos-sdk/node
          test -f yuos-sdk/node/dist/index.js
          test -f yuos-sdk/node/dist/index.d.ts
          npm pack ./yuos-sdk/node \
            --pack-destination "$GITHUB_WORKSPACE/dist" \
            --json > "$RUNNER_TEMP/npm-pack.json"
          node_tarball="$(
            node -e 'console.log(require(process.argv[1])[0].filename)' \
              "$RUNNER_TEMP/npm-pack.json"
          )"
          mv "dist/$node_tarball" "dist/yuos-sdk-node-$SDK_VERSION.tgz"

          cargo package -p yuos-sdk
          cp "target/package/yuos-sdk-$SDK_VERSION.crate" dist/

          git archive \
            --format=tar.gz \
            --prefix="yuos-sdk-go-$SDK_VERSION/" \
            --output="dist/yuos-sdk-go-$SDK_VERSION.tar.gz" \
            HEAD:yuos-sdk/go
          git archive \
            --format=tar.gz \
            --prefix="yuos-sdk-$SDK_VERSION/" \
            --output="dist/yuos-sdk-$SDK_VERSION-source.tar.gz" \
            HEAD:yuos-sdk

      - name: Collect the tested public signing tools
        uses: actions/download-artifact@v4
        with:
          pattern: yu-provenance-tool-*
          path: dist
          merge-multiple: true

      - name: Bind all release artifacts to checksums
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yuos-sdk-${{ inputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create SDK and Go tags
        run: |
          sdk_tag="yuos-sdk-v$SDK_VERSION"
          go_tag="yuos-sdk/go/v$SDK_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$sdk_tag" >/dev/null 2>&1 \
              || git ls-remote --exit-code --tags origin "refs/tags/$go_tag" >/dev/null 2>&1; then
            echo "error: SDK release tag already exists" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$sdk_tag" -m "Yu OS SDK v$SDK_VERSION"
          git tag -a "$go_tag" -m "Yu OS Go SDK v$SDK_VERSION"
          git push --atomic origin "refs/tags/$sdk_tag" "refs/tags/$go_tag"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "yuos-sdk-v$SDK_VERSION" \
            dist/* \
            --verify-tag \
            --title "Yu OS SDK v$SDK_VERSION" \
            --generate-notes
