name: Publish SDK Release

on:
  workflow_dispatch:

concurrency:
  group: yuos-sdk-release
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      display_version: ${{ steps.version.outputs.display_version }}
      semver_version: ${{ steps.version.outputs.semver_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compute dated dev SDK version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_day="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at[:10]')"
          day="${build_day//-/}"
          base="$(python3 -c 'import pathlib, re, tomllib; v = tomllib.loads(pathlib.Path("core/Cargo.toml").read_text())["package"]["version"]; print(re.split(r"[-.]dev", v)[0])')"
          seq=1
          while git ls-remote --exit-code --tags origin "refs/tags/yuos-sdk-v$(printf '%s.dev%s%02d' "$base" "$day" "$seq")" >/dev/null 2>&1; do
            seq=$((seq + 1))
          done
          stamp="$(printf '%s%02d' "$day" "$seq")"
          display_version="${base}.dev${stamp}"
          semver_version="${base}-dev.${stamp}"
          echo "display_version=$display_version" >> "$GITHUB_OUTPUT"
          echo "semver_version=$semver_version" >> "$GITHUB_OUTPUT"
          echo "Computed SDK version: $display_version (SemVer: $semver_version)"

  provenance-tools:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install portable CLI build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Test and build the public provenance CLI
        run: |
          set -euo pipefail
          cargo test -p yu --lib --locked provenance:: -- --test-threads=1
          cargo build --release --locked -p yu --bin yu --target "$RUST_TARGET"
          mkdir -p dist
          install -m 0755 "target/$RUST_TARGET/release/yu" "dist/yu-provenance-linux-$ARCH"
          test "$(stat -c %s "dist/yu-provenance-linux-$ARCH")" -le 134217728
          "dist/yu-provenance-linux-$ARCH" --version
          cargo metadata --locked --format-version 1 --filter-platform "$RUST_TARGET" > "$RUNNER_TEMP/tool-metadata.json"
      - name: Retain tool source pins and upstream notices
        run: |
          python3 - <<'PY'
          import io, json, os, pathlib, tarfile
          metadata = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "tool-metadata.json").read_text())
          packages = {package["id"]: package for package in metadata["packages"]}
          nodes = {node["id"]: node for node in metadata["resolve"]["nodes"]}
          root = next(package["id"] for package in packages.values()
                      if pathlib.Path(package["manifest_path"]).resolve() == pathlib.Path("core/Cargo.toml").resolve())
          selected, pending = set(), [root]
          while pending:
              identity = pending.pop()
              if identity in selected:
                  continue
              selected.add(identity)
              pending.extend(dependency["pkg"] for dependency in nodes[identity]["deps"])
          records = []
          archive = pathlib.Path("dist") / f'yu-provenance-linux-{os.environ["ARCH"]}-notices.tar.gz'
          with tarfile.open(archive, "w:gz") as stream:
              stream.add("LICENSE", arcname="LICENSE", recursive=False)
              for identity in sorted(selected):
                  package = packages[identity]
                  directory = pathlib.Path(package["manifest_path"]).parent
                  paths = {path for path in directory.iterdir() if path.is_file()
                           and path.name.upper().startswith(("LICENSE", "LICENCE", "COPYING", "NOTICE"))}
                  if package.get("license_file"):
                      paths.add(directory / package["license_file"])
                  for path in sorted(paths):
                      content = path.read_bytes()
                      info = tarfile.TarInfo(f'{package["name"]}-{package["version"]}/{path.name}')
                      info.size, info.mode = len(content), 0o644
                      stream.addfile(info, io.BytesIO(content))
                  records.append({name: package.get(name) for name in ("name", "version", "source", "license")})
              content = json.dumps({"revision": os.environ["GITHUB_SHA"], "packages": records},
                                   sort_keys=True, indent=2).encode()
              info = tarfile.TarInfo("sources.json")
              info.size, info.mode = len(content), 0o644
              stream.addfile(info, io.BytesIO(content))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yu-provenance-tool-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, provenance-tools]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DISPLAY_VERSION: ${{ needs.prepare.outputs.display_version }}
      SEMVER_VERSION: ${{ needs.prepare.outputs.semver_version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: yuos-sdk/node/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: yuos-sdk/go/go.mod
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Regenerate wire bindings
        run: |
          python3 yuos-sdk/wire/codegen.py
          git diff --exit-code -- \
            yuos-sdk/rust/src/generated.rs \
            yuos-sdk/python/src/yuos_sdk/generated.py \
            yuos-sdk/node/src/generated.ts \
            yuos-sdk/go/generated.go

      - name: Stamp computed version into SDK packages and docs
        run: |
          python3 scripts/ci/stamp-sdk-version.py "$DISPLAY_VERSION" "$SEMVER_VERSION"

      - name: Install SDK test and build dependencies
        run: |
          python3 -m pip install --upgrade build pytest
          npm ci --prefix yuos-sdk/node

      - name: Test all SDK bindings
        run: |
          PYTHONPATH=yuos-sdk/python/src \
            python3 -m pytest -q yuos-sdk/python/src
          npm test --prefix yuos-sdk/node
          cargo test -p yuos-sdk -- --test-threads=1
          (cd yuos-sdk/go && go test ./...)

      - name: Build SDK release artifacts
        run: |
          mkdir -p dist

          python3 -m build --outdir "$GITHUB_WORKSPACE/dist" yuos-sdk/python

          npm run build --prefix yuos-sdk/node
          test -f yuos-sdk/node/dist/index.js
          test -f yuos-sdk/node/dist/index.d.ts
          npm pack ./yuos-sdk/node \
            --pack-destination "$GITHUB_WORKSPACE/dist" \
            --json > "$RUNNER_TEMP/npm-pack.json"
          node_tarball="$(
            node -e 'console.log(require(process.argv[1])[0].filename)' \
              "$RUNNER_TEMP/npm-pack.json"
          )"
          mv "dist/$node_tarball" "dist/yuos-sdk-node-$DISPLAY_VERSION.tgz"

          cargo package -p yuos-sdk --allow-dirty
          cp "target/package/yuos-sdk-$SEMVER_VERSION.crate" "dist/yuos-sdk-$DISPLAY_VERSION.crate"

          git config user.name "Xiaoyu"
          git config user.email "zxiaoyu.work@gmail.com"
          git checkout -- yuos-sdk/python/pyproject.toml yuos-sdk/python/src/yuos_sdk/__init__.py yuos-sdk/node/package.json yuos-sdk/node/package-lock.json yuos-sdk/rust/Cargo.toml Cargo.lock
          git add yuos-sdk/quickstart.html yuos-sdk/api.html yuos-sdk/reference.html yuos-sdk/linux-app-integration.html yuos-sdk/README.md yuos-sdk/llms.txt yuos-sdk/python/README.md yuos-sdk/node/README.md yuos-sdk/go/README.md yuos-sdk/rust/README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update SDK documentation version to v$DISPLAY_VERSION"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          git archive \
            --format=tar.gz \
            --prefix="yuos-sdk-go-$DISPLAY_VERSION/" \
            --output="dist/yuos-sdk-go-$DISPLAY_VERSION.tar.gz" \
            HEAD:yuos-sdk/go
          git archive \
            --format=tar.gz \
            --prefix="yuos-sdk-$DISPLAY_VERSION/" \
            --output="dist/yuos-sdk-$DISPLAY_VERSION-source.tar.gz" \
            HEAD:yuos-sdk

      - name: Collect the tested public signing tools
        uses: actions/download-artifact@v4
        with:
          pattern: yu-provenance-tool-*
          path: dist
          merge-multiple: true

      - name: Bind all release artifacts to checksums
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yuos-sdk-${{ needs.prepare.outputs.display_version }}
          path: dist/*
          if-no-files-found: error

      - name: Create SDK and Go tags
        run: |
          sdk_tag="yuos-sdk-v$DISPLAY_VERSION"
          go_tag="yuos-sdk/go/v$SEMVER_VERSION"
          git config user.name "Xiaoyu"
          git config user.email "zxiaoyu.work@gmail.com"
          git tag -a "$sdk_tag" -m "Yu OS SDK v$DISPLAY_VERSION"
          git tag -a "$go_tag" -m "Yu OS Go SDK v$SEMVER_VERSION"
          git push --atomic origin "refs/tags/$sdk_tag" "refs/tags/$go_tag"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "yuos-sdk-v$DISPLAY_VERSION" \
            dist/* \
            --verify-tag \
            --title "Yu OS SDK v$DISPLAY_VERSION" \
            --generate-notes

  publish-docs:
    needs: [prepare, release]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: yuos-apt-pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Stage the website and SDK docs while retaining any live OS APT archive
        run: |
          bash web/stage.sh build/pages
          python3 scripts/ci/pages_files.py record website build/pages
          python3 scripts/ci/pages_files.py restore apt build/pages/apt --allow-no-apt

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
