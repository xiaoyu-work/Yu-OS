[Unit]
After=yuosd.service systemd-logind.service multi-user.target getty@tty1.service
Requires=yuosd.service
StartLimitIntervalSec=0

[Service]
RuntimeDirectory=yuos-greetd
RuntimeDirectoryMode=0700
ExecStartPre=/usr/libexec/yuos-desktop-login render
ExecStart=
ExecStart=/usr/sbin/greetd --config /run/yuos-greetd/config.toml
