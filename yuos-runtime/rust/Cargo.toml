[package]
name = "yuos-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "INTERNAL runtime crate for yuos bundled apps and desktop GUI binaries. Not a developer SDK — use `yuos-sdk` for that. Routes every `fs`/`exec`/`pkg`/`notify`/`net` op through `yu app <id> <verb>` so capability gating, audit, and session checkpointing apply uniformly."
repository = "https://github.com/xiaoyu-work/Yu-OS"
publish = false

[[bin]]
name = "yuos-ask-launcher"
path = "src/bin/yuos-ask-launcher.rs"

[dependencies]
yuos-sdk = { path = "../../yuos-sdk/rust" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
