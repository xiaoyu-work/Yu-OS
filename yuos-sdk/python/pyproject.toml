[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yuos-sdk"
dynamic = ["version"]
description = "Official Python SDK for Yu OS — typed bindings to the AI, capability, and system-app surface exposed by the `yu` kernel CLI. Wire protocol v1."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Xiaoyu Z", email = "zxiaoyu.work@gmail.com" },
]
keywords = ["yuos", "sdk", "ai", "capability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xiaoyu-work/Yu-OS/tree/main/yuos-sdk"
Documentation = "https://github.com/xiaoyu-work/Yu-OS/tree/main/yuos-sdk/python"
Repository = "https://github.com/xiaoyu-work/Yu-OS"
Issues = "https://github.com/xiaoyu-work/Yu-OS/issues"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["yuos_sdk*"]

[tool.setuptools.dynamic]
version = { attr = "yuos_sdk.__version__" }

[tool.setuptools.package-data]
yuos_sdk = ["py.typed"]
