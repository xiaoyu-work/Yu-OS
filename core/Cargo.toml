[package]
name = "yu"
version = "0.1.0"
edition = "2021"
description = "Yu OS — agent-native operating system core"

[lib]
name = "yu"
path = "src/lib.rs"

[[bin]]
name = "yu"
path = "src/main.rs"

[[bin]]
name = "yuosd"
path = "src/bin/yuosd.rs"

[[bin]]
name = "yuos-agentd"
path = "src/bin/yuos-agentd.rs"

[[bin]]
name = "yuos-extension-host"
path = "src/bin/yuos-extension-host.rs"

[[bin]]
name = "yuos-approval-helper"
path = "src/bin/yuos-approval-helper.rs"

[[bin]]
name = "yuos-app-runner"
path = "src/bin/yuos-app-runner.rs"

[[bin]]
name = "yuos-gui-runner"
path = "src/bin/yuos-gui-runner.rs"

[[bin]]
name = "yuos-mail-ai-host"
path = "src/bin/yuos-mail-ai-host.rs"

[[bin]]
name = "yuos-security-floor"
path = "src/bin/yuos-security-floor.rs"

[[bin]]
name = "yuos-display-host"
path = "src/bin/yuos-display-host.rs"

[[bin]]
name = "yuos-display-session"
path = "src/bin/yuos-display-session.rs"

[[bin]]
name = "yuos-file-manager"
path = "src/bin/yuos-file-manager.rs"

[[bin]]
name = "yuos-app-apt-hook"
path = "src/bin/yuos-app-apt-hook.rs"

[[bin]]
name = "yuos-notification-panel"
path = "src/bin/yuos-notification-panel.rs"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }

# --- Phase 0 (agent runtime) ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "io-std", "net", "sync", "signal", "process", "fs", "test-util"] }
async-trait = "0.1.92"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
base64 = "0.22.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }
flate2 = "1.1"
tar = "0.4"
tempfile = "3.27.0"
regex = "1"
goblin = "0.10"
bytes = "1"
crc32fast = "1"
zbus = { version = "=5.5.0", default-features = false, features = ["blocking-api", "tokio", "p2p"] }

# Phase 7 (skill bundle signatures): ed25519 verification for skill
# manifests so a `Vendor`/`Hub` install can be authenticated against a
# release key. Default features off — we only need verification, not
# signing/PEM/PKCS#8 import.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1", features = ["serde"] }

# Phase 5.5 (Edge TTS): WebSocket client. Aligned with workspace 0.26 + rustls
# to match `reqwest`'s `rustls-tls` feature already in use here, so the binary
# carries one TLS stack (rustls) instead of two.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# Phase 0.5 (engine package management): native runtimes (llama.cpp, ort,
# ort-genai) are installed by `yu engine update` to /var/lib/yuos/engines and
# loaded at runtime via libloading. No more compile-time link.
libloading = "0.8"

# Phase 2.4 (engine compat enforcement): semver ranges for ort / ort-genai;
# llama.cpp's `bNNNN` build numbers use a custom comparator in
# crate::model::compat.
semver = "1"

# Phase 0.5 (model engines): added when model files arrive
# ort = { version = "2", features = [...] }

# Phase 3 / 6 (added later)
# fastembed = "..."
# rmcp = "..."
# serde_yaml = "..."

# yuos-embed: pure embedding abstractions (Embedder trait + types,
# SemanticStore). Lives in this workspace at crates/yuos-embed/. We
# depend on it so core can keep the config-aware factories
# (`build_default`, `open_default`, `default_path`) while the storage
# and trait definitions are reusable from yuos-semantic and any other
# future consumer.
yuos-embed = { path = "../crates/yuos-embed" }
yuos-sdk = { path = "../yuos-sdk/rust" }
yuos-notification-presentation = { path = "../yuos-sdk/rust/notification-presentation" }

# `yu agent serve` — built-in web UI for headless / WSL setups. axum +
# tower-http give us SSE streaming and a minimal HTTP surface without
# pulling in a heavy framework. Pinned to versions compatible with the
# tokio 1.x runtime already in use; default features only (no openssl).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Embed the Vite-built web UI (HTML/JS/CSS) inside the yu binary so
# `yu agent serve` stays a single self-contained file with zero
# external assets. The `ui/dist/` directory is committed to git.
include_dir = "0.7"
yuosd-client = { version = "0.1.0", path = "../crates/yuosd-client" }
yuos-display-control = { path = "../crates/yuos-display-control" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.16.0", default-features = false, features = ["abi-7-31"] }
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }

[dev-dependencies]
yuos-sdk = { path = "../yuos-sdk/rust" }
zbus = { version = "=5.5.0", default-features = false, features = ["p2p"] }
